<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OjinE Roblox Store</title>
    <style>
        :root {
            --bg-color: #e0f7fa;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #006064;
            --accent-blue: #00bcd4;
            --accent-yellow: #ffeb3b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b2ebf2 0%, #e0f7fa 50%, #fffde7 100%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.18);
            box-sizing: border-box;
            border: 3px solid #ffe082;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #00838f;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #ff8f00;
            font-weight: 700;
            margin: 0 0 15px 0;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 5px;
            color: #00838f;
        }
        .category-group-title {
            font-size: 12px;
            font-weight: bold;
            color: #00838f;
            margin: 10px 0 5px 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .category-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 5px;
        }
        /* Tombol Murni menggunakan tag <button> asli agar responsif instan */
        .cat-btn {
            padding: 14px 8px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b2ebf2 70%, #4dd0e1 100%);
            border: 2px solid #80deea;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #006064;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px 5px rgba(0, 96, 100, 0.2), 0 4px 10px rgba(0, 188, 212, 0.25);
            outline: none;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .cat-btn.active {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffe082 70%, #ffb300 100%);
            border-color: #ffd54f;
            color: #e65100;
            box-shadow: inset -2px -2px 5px rgba(230, 81, 0, 0.3), 0 6px 12px rgba(255, 179, 0, 0.4);
        }
        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-card {
            background: #e0f7fa;
            border: 2px solid #80deea;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #006064;
            width: 100%;
            text-align: left;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .option-card.selected {
            border-color: #fbc02d;
            background: #fffde7;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #00838f;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 2px solid #b2ebf2;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f7fcfc;
            outline: none;
        }
        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        .links-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .wa-link-bubble {
            display: block;
            text-align: center;
            background: radial-gradient(circle at 30% 30%, #ffffff, #81d4fa 60%, #0288d1 100%);
            border: 2px solid #4fc3f7;
            color: #01579b;
            text-decoration: none;
            padding: 13px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset -2px -2px 5px rgba(1, 87, 155, 0.3), 0 4px 10px rgba(2, 136, 209, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏖️ OjinE Roblox Store</h1>
    <p class="subtitle">☀️ Jasa Verifikasi & Top Up Games Terpercaya 🌊</p>

    <div class="section-title">✨ Pilih Kategori Layanan</div>
    
    <div class="category-group-title">🎮 Layanan Roblox</div>
    <div class="category-buttons">
        <button type="button" class="cat-btn active" id="btnJasa" onclick="showCategory('jasa')">🛠️ Jasa Roblox</button>
        <button type="button" class="cat-btn" id="btnRobuxUsername" onclick="showCategory('robux-username')">💎 Robux Username</button>
        <button type="button" class="cat-btn" id="btnRobuxLogin" onclick="showCategory('robux-login')">🔑 Robux Login</button>
        <button type="button" class="cat-btn" id="btnRobuxGamepass" onclick="showCategory('robux-gamepass')">🎫 Robux Game Pass</button>
    </div>

    <div class="category-group-title" style="margin-top: 15px;">🎮 Top Up Games Lainnya</div>
    <div class="category-buttons">
        <button type="button" class="cat-btn" id="btnFF" onclick="showCategory('ff')">🔥 Top Up Free Fire</button>
        <button type="button" class="cat-btn" id="btnML" onclick="showCategory('ml')">⚔️ Top Up Mobile Legends</button>
    </div>

    <div id="productSection">
        <div class="section-title" id="sectionTitle">🛡️ Pilih Produk Jasa Roblox</div>
        <div class="grid-options" id="productList"></div>
    </div>

    <div id="formSection" style="display: none;">
        <div class="section-title" id="formTitle">📝 Data Pembeli</div>
        
        <div id="idFieldContainer">
            <label id="idLabel" for="idInput">Username / ID Roblox:</label>
            <input type="text" id="idInput" placeholder="Masukkan ID / Username Anda">
        </div>

        <div id="zoneFieldContainer" style="display: none;">
            <label for="zoneInput">Server ID / Zone (Contoh: 1234):</label>
            <input type="text" id="zoneInput" placeholder="Masukkan Server ID / Zone ML">
        </div>

        <div id="passwordFieldContainer" style="display: none;">
            <label for="passwordInput">Password / Data Login:</label>
            <input type="text" id="passwordInput" placeholder="Masukkan Password akun Anda">
        </div>

        <label for="paymentMethod">Metode Pembayaran:</label>
        <select id="paymentMethod">
            <option value="">-- Pilih Metode Pembayaran --</option>
            <option value="DANA">DANA (a.n. oujinelours)</option>
            <option value="QRIS">QRIS (a.n. oujinelours)</option>
            <option value="Transfer Bank">Transfer Bank (a.n. oujinelours)</option>
        </select>

        <button type="button" class="checkout-btn" onclick="checkoutWhatsApp()">📱 Checkout ke WhatsApp Admin</button>
    </div>

    <div class="links-container">
        <a href="https://wa.me/6288277328333" target="_blank" class="wa-link-bubble">💬 Hubungi Admin WhatsApp</a>
        <a href="https://whatsapp.com/channel/0029VbECD0n7IUYV47qNEq1C" target="_blank" class="wa-link-bubble" style="background: radial-gradient(circle at 30% 30%, #ffffff, #80cbc4 60%, #00796b 100%); color: #004d40; border-color: #4db6ac;">📢 Saluran Testimoni WhatsApp</a>
    </div>
</div>

<script>
    var selectedProductTitle = "";
    var productType = "";

    function showCategory(cat) {
        var buttons = document.querySelectorAll('.cat-btn');
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove('active');
        }
        
        resetSelection();

        var container = document.getElementById('productList');
        var titleElem = document.getElementById('sectionTitle');
        container.innerHTML = "";

        if (cat === 'jasa') {
            document.getElementById('btnJasa').classList.add('active');
            titleElem.innerText = "🛡️ Pilih Produk Jasa Roblox";

            var listJasa = [
                { title: 'Jasa Verifikasi Roblox Select', price: 'Rp 20.000', type: 'login' },
                { title: 'Jasa Verifikasi Roblox Kids', price: 'Rp 20.000', type: 'login' },
                { title: 'Jasa Verifikasi Roblox Uncheck', price: 'Rp 22.000', type: 'login' },
                { title: 'Verifikasi Muka Roblox', price: 'Rp 10.000', type: 'login' },
                { title: 'Verifikasi ACC Robux', price: 'Rp 5.000', type: 'login' }
            ];

            listJasa.forEach(function(item) {
                var btnCard = document.createElement('button');
                btnCard.type = 'button';
                btnCard.className = 'option-card';
                btnCard.onclick = function() { selectProduct(btnCard, item.title, item.price, item.type); };
                btnCard.innerHTML = '<span>🛡️ ' + item.title + '</span><strong>' + item.price + '</strong>';
                container.appendChild(btnCard);
            });

        } else if (cat === 'robux-username') {
            document.getElementById('btnRobuxUsername').classList.add('active');
            titleElem.innerText = "💎 Robux via Username (Rate 15k/100R)";

            for (var r = 100; r <= 1000; r += 100) {
                (function(robuxCount) {
                    var price = (robuxCount / 100) * 15000;
                    var priceText = 'Rp ' + price.toLocaleString('id-ID');
                    var btnCard = document.createElement('button');
                    btnCard.type = 'button';
                    btnCard.className = 'option-card';
                    btnCard.onclick = function() { selectProduct(btnCard, 'Robux via Username (' + robuxCount + 'R)', priceText, 'username'); };
                    btnCard.innerHTML = '<span>💎 ' + robuxCount + ' Robux (via Username)</span><strong>' + priceText + '</strong>';
                    container.appendChild(btnCard);
                })(r);
            }

        } else if (cat === 'robux-login') {
            document.getElementById('btnRobuxLogin').classList.add('active');
            titleElem.innerText = "🔑 Robux via Login (Mulai 80R = Rp 16.000)";

            var listLogin = [
                { r: 80, price: 16000 },
                { r: 160, price: 32000 },
                { r: 240, price: 48000 },
                { r: 320, price: 64000 },
                { r: 400, price: 80000 },
                { r: 480, price: 96000 },
                { r: 560, price: 112000 },
                { r: 640, price: 128000 },
                { r: 720, price: 144000 },
                { r: 800, price: 160000 },
                { r: 1000, price: 200000 }
            ];

            listLogin.forEach(function(item) {
                var priceText = 'Rp ' + item.price.toLocaleString('id-ID');
                var btnCard = document.createElement('button');
                btnCard.type = 'button';
                btnCard.className = 'option-card';
                btnCard.onclick = function() { selectProduct(btnCard, 'Robux via Login (' + item.r + 'R)', priceText, 'login'); };
                btnCard.innerHTML = '<span>🔑 ' + item.r + ' Robux (via Login)</span><strong>' + priceText + '</strong>';
                container.appendChild(btnCard);
            });

        } else if (cat === 'robux-gamepass') {
            document.getElementById('btnRobuxGamepass').classList.add('active');
            titleElem.innerText = "🎫 Robux via Game Pass (Rate 13.5k/100R)";

            for (var r2 = 100; r2 <= 1000; r2 += 100) {
                (function(robuxCount) {
                    var price = (robuxCount / 100) * 13500;
                    var priceText = 'Rp ' + price.toLocaleString('id-ID');
                    var btnCard = document.createElement('button');
                    btnCard.type = 'button';
                    btnCard.className = 'option-card';
                    btnCard.onclick = function() { selectProduct(btnCard, 'Robux via Game Pass (' + robuxCount + 'R)', priceText, 'username'); };
                    btnCard.innerHTML = '<span>🎫 ' + robuxCount + ' Robux (via Game Pass)</span><strong>' + priceText + '</strong>';
                    container.appendChild(btnCard);
                })(r2);
            }

        } else if (cat === 'ff') {
            document.getElementById('btnFF').classList.add('active');
            titleElem.innerText = "🔥 Free Fire (Proses via ID, Otomatis 1-15 mnt)";

            var listFF = [
                { title: 'BP Card', price: 'Rp 37.766' },
                { title: 'Membership Bulanan', price: 'Rp 75.308' },
                { title: 'Membership Mingguan', price: 'Rp 25.187' },
                { title: '600 Diamond Promo', price: 'Rp 70.740' },
                { title: '635 Diamond Promo', price: 'Rp 74.460' },
                { title: '5 Diamond', price: 'Rp 1.257' },
                { title: '10 Diamond', price: 'Rp 1.976' },
                { title: '15 Diamond', price: 'Rp 2.756' },
                { title: '20 Diamond', price: 'Rp 3.447' },
                { title: '25 Diamond', price: 'Rp 4.257' },
                { title: '30 Diamond', price: 'Rp 5.007' },
                { title: '40 Diamond', price: 'Rp 6.062' },
                { title: '50 Diamond', price: 'Rp 6.411' },
                { title: '55 Diamond', price: 'Rp 7.257' }
            ];

            listFF.forEach(function(item) {
                var btnCard = document.createElement('button');
                btnCard.type = 'button';
                btnCard.className = 'option-card';
                btnCard.onclick = function() { selectProduct(btnCard, 'Free Fire - ' + item.title, item.price, 'ff'); };
                btnCard.innerHTML = '<span>🔥 ' + item.title + '</span><strong>' + item.price + '</strong>';
                container.appendChild(btnCard);
            });

        } else if (cat === 'ml') {
            document.getElementById('btnML').classList.add('active');
            titleElem.innerText = "⚔️ Mobile Legends (Proses via ID, Otomatis 1-15 mnt)";

            var listML = [
                { title: 'Weekly Diamond Pass', price: 'Rp 31.881' },
                { title: 'Weekly Elite Bundle', price: 'Rp 16.943' },
                { title: 'Monthly Epic Bundle', price: 'Rp 82.630' },
                { title: 'Weekly Diamond Pass (Alt)', price: 'Rp 31.712' },
                { title: 'Weekly Diamond Pass x 2', price: 'Rp 63.549' },
                { title: 'Weekly Diamond Pass x 3', price: 'Rp 95.092' },
                { title: 'Weekly Diamond Pass x 4', price: 'Rp 126.156' },
                { title: 'Weekly Diamond Pass x 5', price: 'Rp 157.688' },
                { title: '50 + 50 Diamonds (1x Purchase)', price: 'Rp 16.813' },
                { title: '150 + 150 Diamonds (1x Purchase)', price: 'Rp 49.412' },
                { title: '250 + 250 Diamonds (1x Purchase)', price: 'Rp 81.960' },
                { title: '500 + 500 Diamonds (1x Purchase)', price: 'Rp 162.842' },
                { title: '5 Diamonds', price: 'Rp 2.141' },
                { title: '10 Diamonds (9 + 1 Bonus)', price: 'Rp 3.780' }
            ];

            listML.forEach(function(item) {
                var btnCard = document.createElement('button');
                btnCard.type = 'button';
                btnCard.className = 'option-card';
                btnCard.onclick = function() { selectProduct(btnCard, 'Mobile Legends - ' + item.title, item.price, 'ml'); };
                btnCard.innerHTML = '<span>⚔️ ' + item.title + '</span><strong>' + item.price + '</strong>';
                container.appendChild(btnCard);
            });
        }
    }

    function selectProduct(element, title, price, type) {
        var cards = document.querySelectorAll('.option-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove('selected');
        }
        element.classList.add('selected');

        selectedProductTitle = title + " - " + price;
        productType = type;

        document.getElementById('formSection').style.display = 'block';
        var passContainer = document.getElementById('passwordFieldContainer');
        var zoneContainer = document.getElementById('zoneFieldContainer');
        var idLabel = document.getElementById('idLabel');

        if (type === 'login') {
            passContainer.style.display = 'block';
            zoneContainer.style.display = 'none';
            idLabel.innerText = "Username Roblox:";
        } else if (type === 'ff') {
            passContainer.style.display = 'none';
            zoneContainer.style.display = 'none';
            idLabel.innerText = "ID Free Fire:";
            document.getElementById('passwordInput').value = "";
        } else if (type === 'ml') {
            passContainer.style.display = 'none';
            zoneContainer.style.display = 'block';
            idLabel.innerText = "ID Mobile Legends (User ID):";
            document.getElementById('passwordInput').value = "";
        } else {
            passContainer.style.display = 'none';
            zoneContainer.style.display = 'none';
            idLabel.innerText = "Username Roblox:";
            document.getElementById('passwordInput').value = "";
        }
    }

    function resetSelection() {
        selectedProductTitle = "";
        productType = "";
        var cards = document.querySelectorAll('.option-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove('selected');
        }
        document.getElementById('formSection').style.display = 'none';
    }

    function checkoutWhatsApp() {
        var idVal = document.getElementById('idInput').value.trim();
        var zoneVal = document.getElementById('zoneInput').value.trim();
        var password = document.getElementById('passwordInput').value.trim();
        var paymentMethod = document.getElementById('paymentMethod').value;

        if (!selectedProductTitle) {
            alert("Harap pilih salah satu produk!");
            return;
        }
        if (!idVal) {
            alert("Harap masukkan ID / Username Anda!");
            return;
        }
        if (productType === 'ml' && !zoneVal) {
            alert("Harap masukkan Server ID / Zone Mobile Legends Anda!");
            return;
        }
        if (productType === 'login' && !password) {
            alert("Harap masukkan Password / Data Login!");
            return;
        }
        if (!paymentMethod) {
            alert("Harap pilih metode pembayaran!");
            return;
        }

        var adminPhone = "6288277328333";
        var message = "Halo Admin OjinE Roblox Store, saya ingin memesan:\n\n" +
                        "• Layanan: " + selectedProductTitle + "\n";

        if (productType === 'ml') {
            message += "• ID ML: " + idVal + " (Server: " + zoneVal + ")\n";
        } else if (productType === 'ff') {
            message += "• ID Free Fire: " + idVal + "\n";
        } else {
            message += "• Username: " + idVal + "\n";
            if (productType === 'login') {
                message += "• Password: " + password + "\n";
            }
        }

        message += "• Pembayaran via: " + paymentMethod + " (a.n. oujinelours)\n\n" +
                   "Mohon segera diproses ya kak, bukti transfer akan segera dikirim. Terima kasih!";

        var encodedMessage = encodeURIComponent(message);
        window.open("https://wa.me/" + adminPhone + "?text=" + encodedMessage, '_blank');
    }

    window.onload = function() {
        showCategory('jasa');
    };
</script>

</body>
</html>
