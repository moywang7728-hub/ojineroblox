<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OjinE Roblox Store</title>
    <style>
        :root {
            --bg-color: #e0f7fa;
            --card-bg: #ffffff;
            --text-color: #006064;
            --accent-blue: #00bcd4;
            --accent-yellow: #ffeb3b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b2ebf2 0%, #e0f7fa 50%, #fffde7 100%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.15);
            box-sizing: border-box;
            border: 3px solid #ffe082;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 5px;
            color: #00838f;
        }
        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #ff8f00;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 5px;
            color: #00838f;
        }

        /* Tombol Kategori Bubble Air */
        .category-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .cat-btn {
            flex: 1;
            padding: 14px 10px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b2ebf2 70%, #4dd0e1 100%);
            border: 2px solid #80deea;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            color: #006064;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: inset -2px -2px 5px rgba(0, 96, 100, 0.2), 0 4px 10px rgba(0, 188, 212, 0.3);
        }
        .cat-btn.active {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffe082 70%, #ffb300 100%);
            border-color: #ffd54f;
            color: #e65100;
            box-shadow: inset -2px -2px 5px rgba(230, 81, 0, 0.3), 0 6px 12px rgba(255, 179, 0, 0.4);
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-card {
            background: #e0f7fa;
            border: 2px solid #80deea;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #006064;
        }
