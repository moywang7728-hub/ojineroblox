<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OjinE Roblox Store</title>
    <style>
        :root {
            --bg-color: #e0f7fa;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #006064;
            --accent-blue: #00bcd4;
            --accent-yellow: #ffeb3b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b2ebf2 0%, #e0f7fa 50%, #fffde7 100%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.18);
            box-sizing: border-box;
            border: 3px solid #ffe082;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #00838f;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #ff8f00;
            font-weight: 700;
            margin: 0 0 15px 0;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 5px;
            color: #00838f;
        }
        .category-group-title {
            font-size: 12px;
            font-weight: bold;
            color: #00838f;
            margin: 10px 0 5px 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tata letak tombol kategori 2 kolom */
        .category-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        /* Tombol kategori */
        .cat-btn {
            padding: 14px 8px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b2ebf2 70%, #4dd0e1 100%);
            border: 2px solid #80deea;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #006064;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px 5px rgba(0, 96, 100, 0.2), 0 4px 10px rgba(0, 188, 212, 0.25);
            outline: none;
            width: 100%;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .cat-btn.active {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffe082 70%, #ffb300 100%);
            border-color: #ffd54f;
            color: #e65100;
            box-shadow: inset -2px -2px 5px rgba(230, 81, 0, 0.3), 0 6px 12px rgba(255, 179, 0, 0.4);
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-card {
            background: #e0f7fa;
            border: 2px solid #80deea;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #006064;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .option-card.selected {
            border-color: #fbc02d;
            background: #fffde7;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #00838f;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 2px solid #b2ebf2;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f7fcfc;
            outline: none;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .links-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .wa-link-bubble {
            display: block;
            text-align: center;
            background: radial-gradient(circle at 30% 30%, #ffffff, #81d4fa 60%, #0288d1 100%);
            border: 2px solid #4fc3f7;
            color: #01579b;
            text-decoration: none;
            padding: 13px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset -2px -2px 5px rgba(1, 87, 155, 0.3), 0 4px 10px rgba(2, 136, 209, 0.3);
        }
    </style>
</head>
