<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OjinE Roblox Store</title>
    <style>
        :root {
            --bg-color: #e0f7fa;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #006064;
            --accent-blue: #00bcd4;
            --accent-yellow: #ffeb3b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b2ebf2 0%, #e0f7fa 50%, #fffde7 100%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(0, 188, 212, 0.18);
            box-sizing: border-box;
            border: 3px solid #ffe082;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #00838f;
        }
        p.subtitle {
            text-align: center;
            font-size: 13px;
            color: #ff8f00;
            font-weight: 700;
            margin: 0 0 15px 0;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            border-bottom: 2px dashed var(--accent-blue);
            padding-bottom: 5px;
            color: #00838f;
        }

        /* Tata letak tombol kategori rapi 2 kolom */
        .category-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        /* Style Bubble Air */
        .cat-btn {
            padding: 12px 10px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b2ebf2 70%, #4dd0e1 100%);
            border: 2px solid #80deea;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #006064;
            cursor: pointer;
            text-align: center;
            box-shadow: inset -2px -2px 5px rgba(0, 96, 100, 0.2), 0 4px 10px rgba(0, 188, 212, 0.25);
            outline: none;
            transition: transform 0.1s;
        }
        .cat-btn:active {
            transform: scale(0.96);
        }
        .cat-btn.active {
            background: radial-gradient(circle at 30% 30%, #ffffff, #ffe082 70%, #ffb300 100%);
            border-color: #ffd54f;
            color: #e65100;
            box-shadow: inset -2px -2px 5px rgba(230, 81, 0, 0.3), 0 6px 12px rgba(255, 179, 0, 0.4);
        }

        .grid-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-card {
            background: #e0f7fa;
            border: 2px solid #80deea;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #006064;
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .option-card.selected {
            border-color: #fbc02d;
            background: #fffde7;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.6);
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #00838f;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 2px solid #b2ebf2;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f7fcfc;
            outline: none;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .links-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .wa-link-bubble {
            display: block;
            text-align: center;
            background: radial-gradient(circle at 30% 30%, #ffffff, #81d4fa 60%, #0288d1 100%);
            border: 2px solid #4fc3f7;
            color: #01579b;
            text-decoration: none;
            padding: 13px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: inset -2px -2px 5px rgba(1, 87, 155, 0.3), 0 4px 10px rgba(2, 136, 209, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏖️ OjinE Roblox Store</h1>
    <p class="subtitle">☀️ Jasa Verifikasi & Top Up Robux Terpercaya 🌊</p>

    <!-- Kategori Utama Bubble Air -->
    <div class="section-title">✨ Pilih Kategori Layanan</div>
    <div class="category-buttons">
        <button class="cat-btn active" id="btnJasa" onclick="showCategory('jasa')">🛠️ Jasa Roblox</button>
        <button class="cat-btn" id="btnRobuxUsername" onclick="showCategory('robux-username')">💎 Robux via Username</button>
        <button class="cat-btn" id="btnRobuxLogin" onclick="showCategory('robux-login')">🔑 Robux via Login</button>
        <button class="cat-btn" id="btnRobuxGamepass" onclick="showCategory('robux-gamepass')">🎫 Robux via Game Pass</button>
    </div>

    <!-- Sub-Menu Produk -->
    <div id="productSection">
        <div class="section-title" id="sectionTitle">🛡️ Pilih Produk Jasa Roblox</div>
        <div class="grid-options" id="productList"></div>
    </div>

    <!-- Form Data Pembeli -->
    <div id="formSection" style="display: none;">
        <div class="section-title">📝 Data Pembeli</div>
        
        <label for="usernameInput">Username Roblox:</label>
        <input type="text" id="usernameInput" placeholder="Masukkan Username Roblox Anda">

        <div id="passwordFieldContainer" style="display: none;">
            <label for="passwordInput">Password / Data Login:</label>
            <input type="text" id="passwordInput" placeholder="Masukkan Password akun Anda">
        </div>

        <label for="paymentMethod">Metode Pembayaran:</label>
        <select id="paymentMethod">
            <option value="">-- Pilih Metode Pembayaran --</option>
            <option value="DANA">DANA (a.n. oujinelours)</option>
            <option value="QRIS">QRIS (a.n. oujinelours)</option>
            <option value="Transfer Bank">Transfer Bank (a.n. oujinelours)</option>
        </select>

        <button class="checkout-btn" onclick="checkoutWhatsApp()">📱 Checkout ke WhatsApp Admin</button>
    </div>

    <!-- Link Pendukung Bubble Air -->
    <div class="links-container">
        <a href="https://wa.me/6288277328333" target="_blank" class="wa-link-bubble">💬 Hubungi Admin WhatsApp</a>
        <a href="https://whatsapp.com" target="_blank" class="wa-link-bubble" style="background: radial-gradient(circle at 30% 30%, #ffffff, #80cbc4 60%, #00796b 100%); color: #004d40; border-color: #4db6ac;">📢 Saluran Testimoni WhatsApp</a>
    </div>
</div>

<script>
    var selectedProductTitle = "";
    var productType = "";

    function showCategory(cat) {
        var buttons = document.querySelectorAll('.cat-btn');
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove('active');
        }
        
        resetSelection();

        var container = document.getElementById('productList');
        var titleElem = document.getElementById('sectionTitle');
        container.innerHTML = "";

        if (cat === 'jasa') {
            document.getElementById('btnJasa').classList.add('active');
            titleElem.innerText = "🛡️ Pilih Produk Jasa Roblox";

            var listJasa = [
                { title: 'Jasa Verifikasi Roblox Select', price: 'Rp 20.000', type: 'login' },
                { title: 'Jasa Verifikasi Roblox Kids', price: 'Rp 20.000', type: 'login' },
                { title: 'Jasa Verifikasi Roblox Uncheck', price: 'Rp 22.000', type: 'login' },
                { title: 'Verifikasi Muka Roblox', price: 'Rp 10.000', type: 'login' },
                { title: 'Verifikasi ACC Robux', price: 'Rp 5.000', type: 'login' }
            ];

            listJasa.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'option-card';
                card.onclick = function() { selectProduct(this, item.title, item.price, item.type); };
                card.innerHTML = '<span>🛡️ ' + item.title + '</span><strong>' + item.price + '</strong>';
                container.appendChild(card);
            });

        } else if (cat === 'robux-username') {
            document.getElementById('btnRobuxUsername').classList.add('active');
            titleElem.innerText = "💎 Robux via Username (Rate 15k/100R)";

            for (var r = 100; r <= 1000; r += 100) {
                (function(robuxCount) {
                    var price = (robuxCount / 100) * 15000;
                    var priceText = 'Rp ' + price.toLocaleString('id-ID');
                    var card = document.createElement('div');
                    card.className = 'option-card';
                    card.onclick = function() { selectProduct(this, 'Robux via Username (' + robuxCount + 'R)', priceText, 'username'); };
                    card.innerHTML = '<span>💎 ' + robuxCount + ' Robux (via Username)</span><strong>' + priceText + '</strong>';
                    container.appendChild(card);
                })(r);
            }

        } else if (cat === 'robux-login') {
            document.getElementById('btnRobuxLogin').classList.add('active');
            titleElem.innerText = "🔑 Robux via Login (Mulai 80R = Rp 16.000)";

            var listLogin = [
                { r: 80, price: 16000 },
                { r: 160, price: 32000 },
                { r: 240, price: 48000 },
                { r: 320, price: 64000 },
                { r: 400, price: 80000 },
                { r: 480, price: 96000 },
                { r: 560, price: 112000 },
                { r: 640, price: 128000 },
                { r: 720, price: 144000 },
                { r: 800, price: 160000 },
                { r: 1000, price: 200000 }
            ];

            listLogin.forEach(function(item) {
                var priceText = 'Rp ' + item.price.toLocaleString('id-ID');
                var card = document.createElement('div');
                card.className = 'option-card';
                card.onclick = function() { selectProduct(this, 'Robux via Login (' + item.r + 'R)', priceText, 'login'); };
                card.innerHTML = '<span>🔑 ' + item.r + ' Robux (via Login)</span><strong>' + priceText + '</strong>';
                container.appendChild(card);
            });

        } else if (cat === 'robux-gamepass') {
            document.getElementById('btnRobuxGamepass').classList.add('active');
            titleElem.innerText = "🎫 Robux via Game Pass (Rate 13.5k/100R)";

            for (var r2 = 100; r2 <= 1000; r2 += 100) {
                (function(robuxCount) {
                    var price = (robuxCount / 100) * 13500;
                    var priceText = 'Rp ' + price.toLocaleString('id-ID');
                    var card = document.createElement('div');
                    card.className = 'option-card';
                    card.onclick = function() { selectProduct(this, 'Robux via Game Pass (' + robuxCount + 'R)', priceText, 'username'); };
                    card.innerHTML = '<span>🎫 ' + robuxCount + ' Robux (via Game Pass)</span><strong>' + priceText + '</strong>';
                    container.appendChild(card);
                })(r2);
            }
        }
    }

    function selectProduct(element, title, price, type) {
        var cards = document.querySelectorAll('.option-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove('selected');
        }
        element.classList.add('selected');

        selectedProductTitle = title + " - " + price;
        productType = type;

        document.getElementById('formSection').style.display = 'block';
        var passContainer = document.getElementById('passwordFieldContainer');

        if (type === 'login') {
            passContainer.style.display = 'block';
        } else {
            passContainer.style.display = 'none';
            document.getElementById('passwordInput').value = "";
        }
    }

    function resetSelection() {
        selectedProductTitle = "";
        productType = "";
        var cards = document.querySelectorAll('.option-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove('selected');
        }
        document.getElementById('formSection').style.display = 'none';
    }

    function checkoutWhatsApp() {
        var username = document.getElementById('usernameInput').value.trim();
        var password = document.getElementById('passwordInput').value.trim();
        var paymentMethod = document.getElementById('paymentMethod').value;

        if (!selectedProductTitle) {
            alert("Harap pilih salah satu produk!");
            return;
        }
        if (!username) {
            alert("Harap masukkan Username Roblox Anda!");
            return;
        }
        if (productType === 'login' && !password) {
            alert("Harap masukkan Password / Data Login!");
            return;
        }
        if (!paymentMethod) {
            alert("Harap pilih metode pembayaran!");
            return;
        }

        var adminPhone = "6288277328333";
        var message = "Halo Admin OjinE Roblox Store, saya ingin memesan:\n\n" +
                        "• Layanan: " + selectedProductTitle + "\n" +
                        "• Username: " + username + "\n";
        
        if (productType === 'login') {
            message += "• Password: " + password + "\n";
        }

        message += "• Pembayaran via: " + paymentMethod + " (a.n. oujinelours)\n\n" +
                   "Mohon segera diproses ya kak, bukti transfer akan segera dikirim. Terima kasih!";

        var encodedMessage = encodeURIComponent(message);
        window.open("https://wa.me/" + adminPhone + "?text=" + encodedMessage, '_blank');
    }

    // Load default category
    document.addEventListener("DOMContentLoaded", function() {
        showCategory('jasa');
    });
</script>

</body>
</html>
